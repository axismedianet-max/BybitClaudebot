<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudeBot Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0d; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 14px; padding: 16px; }
h1 { font-size: 18px; color: #fff; margin-bottom: 4px; }
.subtitle { color: #555; font-size: 12px; margin-bottom: 20px; }
.cards { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; padding: 14px 20px; min-width: 160px; }
.card .label { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.card .value { font-size: 22px; color: #fff; font-weight: bold; }
.card .value.green { color: #4caf8a; }
.card .value.red { color: #e05a5a; }
.card .value.yellow { color: #d4a04a; }
.pos-bar { height: 6px; background: #222; border-radius: 3px; margin-top: 8px; }
.pos-bar-fill { height: 100%; background: #4a8cd4; border-radius: 3px; transition: width 0.3s; }
section { margin-bottom: 28px; }
section h2 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 6px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 10px; border-bottom: 1px solid #1e1e1e; }
td { padding: 8px 10px; border-bottom: 1px solid #161616; font-size: 13px; white-space: nowrap; }
tr:hover td { background: #141414; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; }
.badge.win { background: #1a3a2a; color: #4caf8a; }
.badge.loss { background: #3a1a1a; color: #e05a5a; }
.badge.timeout { background: #2a2a1a; color: #d4a04a; }
.dots { font-size: 14px; letter-spacing: 2px; }
.ts { color: #444; font-size: 11px; }
.pnl-pos { color: #4caf8a; }
.pnl-neg { color: #e05a5a; }
.price-live { color: #aaa; }
.refresh-btn { background: #1e1e1e; border: 1px solid #333; color: #aaa; padding: 5px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; transition: all 0.15s; }
.refresh-btn:hover { background: #252525; color: #fff; }
.refresh-btn.loading { color: #4a8cd4; border-color: #4a8cd4; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 0.7s linear infinite; }
.header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
#status { font-size: 11px; color: #444; }
#price-status { font-size: 11px; color: #333; }
.empty { color: #333; padding: 16px 10px; font-style: italic; }
.blink { animation: blink 0.3s ease; }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
</style>
</head>
<body>

<div class="header-row">
  <h1>BybitClaudebot</h1>
  <button class="refresh-btn" onclick="reloadData()">↻ Refresh</button>
  <span id="status">loading...</span>
  <span id="price-status"></span>
</div>
<div class="subtitle">Positions auto-refresh every 30s · Live PnL every 10s</div>

<div class="cards" id="cards"></div>

<section>
  <h2>Open Positions</h2>
  <table id="open-table">
    <thead><tr>
      <th>Symbol</th><th>TF</th><th>Entry</th><th>Now</th><th>TP</th><th>SL</th><th>Unreal. PnL</th><th>Size</th><th>Bars</th><th>Signals</th><th>Opened</th>
    </tr></thead>
    <tbody id="open-body"></tbody>
  </table>
</section>

<section>
  <h2>Closed Trades</h2>
  <table id="closed-table">
    <thead><tr>
      <th>Symbol</th><th>TF</th><th>Result</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Signals</th><th>Opened</th><th>Closed</th>
    </tr></thead>
    <tbody id="closed-body"></tbody>
  </table>
</section>

<script>
const MAX_POS = 10;

let currentData = null;
let livePrices = {};

function fmt(n, dec) {
  if (n === undefined || n === null) return '—';
  const v = Number(n);
  if (dec !== undefined) return v.toFixed(dec);
  // auto decimals based on magnitude
  if (v >= 100)  return v.toFixed(2);
  if (v >= 1)    return v.toFixed(4);
  if (v >= 0.01) return v.toFixed(5);
  return v.toFixed(6);
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-GB', { month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
}

function signalDots(s) {
  if (!s) return '—';
  let d = '';
  d += s.rsiOversold ? '🟢' : '⚪';
  d += s.bbSqueeze   ? '🟡' : '⚪';
  d += s.higherLows  ? '🔵' : '⚪';
  return `<span class="dots" title="RSI oversold · BB squeeze · Higher lows">${d}</span>`;
}

// ── Fetch live prices from Bybit public API ──────────────────────────────────
async function fetchLivePrices(symbols) {
  if (!symbols.length) return;
  // Batch: fetch all tickers for linear category, then filter
  try {
    const url = 'https://api.bybit.com/v5/market/tickers?category=linear';
    const res = await fetch(url);
    const json = await res.json();
    if (json.retCode !== 0 || !json.result?.list) return;
    for (const t of json.result.list) {
      if (symbols.includes(t.symbol)) {
        livePrices[t.symbol] = parseFloat(t.lastPrice);
      }
    }
  } catch (e) {
    // silently ignore — stale prices stay
  }
}

// ── Update just the price/PnL cells without re-rendering everything ──────────
function updatePriceCells() {
  if (!currentData) return;
  const open = currentData.openTrades || [];
  let totalUnreal = 0;

  for (const trade of open) {
    const price = livePrices[trade.symbol];
    const row = document.getElementById('row-' + trade.id);
    if (!row) continue;

    const priceCell = row.querySelector('.cell-price');
    const pnlCell   = row.querySelector('.cell-upnl');

    if (price) {
      const pct = ((price - trade.entryPrice) / trade.entryPrice * 100);
      const upnl = (price - trade.entryPrice) * trade.qty;
      totalUnreal += upnl;

      if (priceCell) {
        priceCell.textContent = fmt(price);
        priceCell.className = 'cell-price price-live ' + (price >= trade.entryPrice ? 'pnl-pos' : 'pnl-neg');
      }
      if (pnlCell) {
        const sign = upnl >= 0 ? '+' : '';
        pnlCell.innerHTML = `<span class="${upnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${sign}$${upnl.toFixed(2)}</span> <span class="ts">(${sign}${pct.toFixed(1)}%)</span>`;
        pnlCell.classList.add('blink');
        setTimeout(() => pnlCell.classList.remove('blink'), 300);
      }
    }
  }

  // Update unrealised PnL card
  const card = document.getElementById('upnl-card');
  if (card) {
    const cls = totalUnreal >= 0 ? 'green' : 'red';
    const sign = totalUnreal >= 0 ? '+' : '';
    card.innerHTML = `<div class="label">Unrealised PnL</div><div class="value ${cls}">${sign}$${totalUnreal.toFixed(2)}</div>`;
  }

  const now = new Date().toLocaleTimeString();
  document.getElementById('price-status').textContent = '· prices ' + now;
}

async function tickPrices() {
  if (!currentData) return;
  const symbols = [...new Set((currentData.openTrades || []).map(t => t.symbol))];
  await fetchLivePrices(symbols);
  updatePriceCells();
}

// ── Full render from data ────────────────────────────────────────────────────
function render(data) {
  currentData = data;
  const open   = data.openTrades   || [];
  const closed = data.closedTrades || [];

  const totalPnl    = closed.reduce((s, t) => s + (t.pnl || 0), 0);
  const decided     = closed.filter(t => t.outcome !== 'timeout');
  const wins        = decided.filter(t => t.outcome === 'win');
  const winRate     = decided.length ? (wins.length / decided.length * 100).toFixed(0) : '—';
  const equity      = data.balance || 0;
  const unrealised  = data.unrealisedPnl || 0;
  const pnlClass    = totalPnl >= 0 ? 'green' : 'red';
  const upnlClass   = unrealised >= 0 ? 'green' : 'red';
  const upnlSign    = unrealised >= 0 ? '+' : '';

  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="label">Equity</div>
      <div class="value">$${equity.toFixed(2)}</div>
    </div>
    <div class="card">
      <div class="label">Realised PnL</div>
      <div class="value ${pnlClass}">${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(2)}</div>
    </div>
    <div class="card" id="upnl-card">
      <div class="label">Unrealised PnL</div>
      <div class="value ${upnlClass}">${upnlSign}$${unrealised.toFixed(2)}</div>
    </div>
    <div class="card">
      <div class="label">Win Rate</div>
      <div class="value ${decided.length ? (winRate >= 50 ? 'green' : 'red') : ''}">${winRate}${decided.length ? '%' : ''}</div>
    </div>
    <div class="card">
      <div class="label">Positions</div>
      <div class="value">${open.length} / ${MAX_POS}</div>
      <div class="pos-bar"><div class="pos-bar-fill" style="width:${(open.length/MAX_POS*100).toFixed(0)}%"></div></div>
    </div>
    <div class="card">
      <div class="label">Total Trades</div>
      <div class="value yellow">${closed.length}</div>
    </div>
  `;

  // Open trades
  const ob = document.getElementById('open-body');
  if (open.length === 0) {
    ob.innerHTML = '<tr><td colspan="11" class="empty">No open positions</td></tr>';
  } else {
    ob.innerHTML = open.map(t => `
      <tr id="row-${t.id}">
        <td>${t.symbol}</td>
        <td>${t.timeframe}</td>
        <td>${fmt(t.entryPrice)}</td>
        <td class="cell-price price-live">…</td>
        <td style="color:#4caf8a">${fmt(t.takeProfit)}</td>
        <td style="color:#e05a5a">${fmt(t.stopLoss)}</td>
        <td class="cell-upnl"><span class="ts">…</span></td>
        <td>$${fmt(t.positionUSDT, 2)}</td>
        <td>${t.barsHeld}</td>
        <td>${signalDots(t.signals)}</td>
        <td class="ts">${fmtTime(t.entryTime)}</td>
      </tr>
    `).join('');
  }

  // Closed trades (newest first)
  const cb = document.getElementById('closed-body');
  const sortedClosed = [...closed].reverse();
  if (sortedClosed.length === 0) {
    cb.innerHTML = '<tr><td colspan="9" class="empty">No closed trades yet</td></tr>';
  } else {
    cb.innerHTML = sortedClosed.map(t => {
      const pnl = t.pnl || 0;
      const pnlStr = pnl !== 0
        ? `<span class="${pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</span>`
        : '<span class="ts">—</span>';
      return `
        <tr>
          <td>${t.symbol}</td>
          <td>${t.timeframe}</td>
          <td><span class="badge ${t.outcome}">${t.outcome}</span></td>
          <td>${fmt(t.entryPrice)}</td>
          <td>${t.exitPrice ? fmt(t.exitPrice) : '—'}</td>
          <td>${pnlStr}</td>
          <td>${signalDots(t.signals)}</td>
          <td class="ts">${fmtTime(t.entryTime)}</td>
          <td class="ts">${fmtTime(t.exitTime)}</td>
        </tr>
      `;
    }).join('');
  }

  // Immediately fetch live prices after render
  tickPrices();
}

// ── Load data from live_data.js ──────────────────────────────────────────────
function reloadData() {
  const btn = document.querySelector('.refresh-btn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="spin">↻</span> Refreshing…';

  const old = document.getElementById('data-script');
  if (old) old.remove();
  const s = document.createElement('script');
  s.id = 'data-script';
  s.src = 'live_data.js?t=' + Date.now();
  s.onload = () => {
    btn.classList.remove('loading');
    btn.innerHTML = '↻ Refresh';
    if (window.LIVE_DATA) {
      render(window.LIVE_DATA);
      const ts = new Date(window.LIVE_DATA_TS).toLocaleTimeString();
      document.getElementById('status').textContent = 'data ' + ts;
    } else {
      document.getElementById('status').textContent = 'waiting for live_data.js...';
    }
  };
  s.onerror = () => {
    btn.classList.remove('loading');
    btn.innerHTML = '↻ Refresh';
    document.getElementById('status').textContent = 'live_data.js not found — run live.js first';
  };
  document.body.appendChild(s);
}

// Data reloads every 30s, price ticks every 10s
setInterval(reloadData, 30000);
setInterval(tickPrices, 10000);
reloadData();
</script>
</body>
</html>
